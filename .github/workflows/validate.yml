name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Run Ground Supabase suite
        run: npm run test:supabase

      - name: Run project validation
        run: npm run check

      - name: Run governed collaboration E2E
        run: npm run test:e2e:governance:prebuilt

      - name: Run Ground hosted E2E
        run: npm run test:e2e:ground

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

